<div class="overlay" (click)="onClose.emit()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <h3>Cập nhật cổ phiếu</h3>
    <p>Mã: <strong>{{ stock.code }}</strong></p>

    <form [formGroup]="updateForm" (ngSubmit)="onSubmit()">

      <div class="field">
        <label>Tên cổ phiếu</label>
        <input type="text" formControlName="name">
        <div class="error"
          *ngIf="updateForm.get('name')?.invalid && updateForm.get('name')?.touched">
          Tên là bắt buộc
        </div>
      </div>

      <div class="field">
        <label>Giá hiện tại ($)</label>
        <input type="number" formControlName="price">
        <div class="error"
          *ngIf="updateForm.get('price')?.invalid && updateForm.get('price')?.touched">
          Giá phải là số dương
        </div>
      </div>

      <div class="field">
        <label>Giá trước đó ($)</label>
        <input type="number" formControlName="previousPrice">
      </div>

      <div class="field">
        <label>Sàn giao dịch</label>
        <select formControlName="exchange">
          <option value="NASDAQ">NASDAQ</option>
          <option value="NYSE">NYSE</option>
          <option value="NSE">NSE</option>
        </select>
      </div>

      <div class="actions">
        <button type="button" (click)="onClose.emit()">Hủy</button>
        <button type="submit" [disabled]="updateForm.invalid">Lưu</button>
      </div>

    </form>
  </div>
</div>
